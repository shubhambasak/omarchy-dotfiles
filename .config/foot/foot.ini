[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=Adwaita Mono:size=13,JetBrainsMono Nerd Font:size=13
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
multiplier=7.0
lines=10000

[cursor]
style=block
blink=no

[colors-dark]
# Theme's own selection color (1a1a1a on a pure 000000 background) is nearly
# invisible - override with the theme's accent gray so selected text actually shows.
selection-foreground=000000
selection-background=8d8d8d

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
